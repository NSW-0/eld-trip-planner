services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    plan: starter
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ORS_API_KEY
        value: ""
      - key: NOMINATIM_USER_AGENT
        value: ELDTripPlanner/1.0 (HOS trip planning)